name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HonorPCHelper
          path: dist/HonorPCHelper.exe

      # Описание релиза берётся из сообщения аннотированного тега,
      # поэтому список "Что нового" пишется один раз - при его создании.
      - name: Read tag message
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HonorPCHelper.exe
          body: ${{ steps.notes.outputs.body }}
