name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: HonorPCHelper
          path: dist/HonorPCHelper.exe

      # Описание релиза берётся из RELEASE_NOTES.md: файл лежит рядом с кодом,
      # правится в том же коммите и не зависит от того, как CI выгрузил тег.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HonorPCHelper.exe
          body_path: RELEASE_NOTES.md
